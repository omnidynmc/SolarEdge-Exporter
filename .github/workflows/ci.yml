name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  REGISTRY: hangar.hackand.ninja
  IMAGE_NAME: solaredge/exporter

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    # Internal runner: this job pushes to Harbor with its own robot credential
    # and deploys to the dynmc cluster, both of which need LAN reach.
    # BARE `hangar`, not the two-label form `[self-hosted, hangar]`: that form
    # matches only the classic LXC runners, which are being deleted. ARC
    # scale-set runners are matched by scale set NAME and carry no `self-hosted`
    # label, so a job left on the two-label form queues forever.
    runs-on: hangar
    steps:
      - uses: actions/checkout@v4
      - name: Short SHA
        run: echo "SHA7=$(echo ${GITHUB_SHA} | cut -c1-7)" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:main-${{ env.SHA7 }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:main-latest
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max
